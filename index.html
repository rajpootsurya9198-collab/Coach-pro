<style>
:root{
  --board:#1F3D33;
  --board-dark:#16302A;
  --paper:#FBF7EE;
  --paper-dim:#F1ECDD;
  --amber:#E8A33D;
  --amber-dark:#C9832A;
  --rust:#C6553D;
  --sage:#4C8C6B;
  --ink:#2B2B3D;
  --ink-soft:#5C5C6E;
  --line:#E4DCC8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* ---------- Layout ---------- */
#app{min-height:100vh;}
.hidden{display:none !important;}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, rgba(232,163,61,0.12), transparent 40%),
  radial-gradient(circle at 80% 80%, rgba(76,140,107,0.10), transparent 40%),
  var(--board);
  padding:24px;}
.login-card{background:var(--paper);width:100%;max-width:400px;border-radius:18px;padding:38px 32px;box-shadow:0 30px 60px rgba(0,0,0,0.35);position:relative;overflow:hidden;}
.login-card::before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:var(--amber);opacity:0.15;border-radius:50%;}
.chalk-badge{width:52px;height:52px;border-radius:12px;background:var(--board);display:flex;align-items:center;justify-content:center;color:var(--amber);font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-bottom:18px;}
.login-card h1{font-size:26px;margin:0 0 4px;color:var(--board);}
.login-card p.sub{color:var(--ink-soft);margin:0 0 26px;font-size:14px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);outline:none;transition:border-color .15s;}
.field input:focus, .field select:focus{border-color:var(--amber);}
.btn{cursor:pointer;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:11px 18px;transition:transform .1s, box-shadow .15s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--board);color:var(--paper);width:100%;}
.btn-primary:hover{background:var(--board-dark);}
.btn-amber{background:var(--amber);color:var(--board);}
.btn-amber:hover{background:var(--amber-dark);}
.btn-ghost{background:transparent;color:var(--board);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--board);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
.login-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);}
.login-toggle a{color:var(--amber-dark);cursor:pointer;font-weight:600;text-decoration:none;}
.err-box{background:#FBE8E4;color:var(--rust);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none;}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--board);color:var(--paper);flex-shrink:0;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px;}
.sidebar .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--amber);color:var(--board);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;}
.sidebar .brand .name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
.sidebar .centre-name{font-size:11.5px;color:#9FC2B3;padding:0 8px 18px;letter-spacing:.02em;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#CFE3D9;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:3px;transition:background .12s;}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:var(--amber);color:var(--board);font-weight:700;}
.nav-item .ic{width:18px;text-align:center;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.12);}
.logout-btn{width:100%;background:rgba(255,255,255,0.08);color:#F1E3C8;}
.logout-btn:hover{background:rgba(255,255,255,0.15);}

.main{flex:1;padding:28px 32px 60px;max-width:1200px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
.topbar h1{margin:0;font-size:26px;color:var(--board);}
.topbar .subtitle{color:var(--ink-soft);font-size:13.5px;margin-top:3px;}

/* mobile */
.mobile-topbar{display:none;}
@media(max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{display:none;}
  .sidebar.open{display:flex;position:fixed;z-index:40;width:230px;box-shadow:0 0 40px rgba(0,0,0,0.4);}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--board);color:var(--paper);padding:14px 16px;position:sticky;top:0;z-index:30;}
  .mobile-topbar .brand{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;}
  .mobile-topbar .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--amber);color:var(--board);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .main{padding:20px 16px 60px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:35;}
}

/* ---------- Cards / stats ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:860px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;}
.stat-card .label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
.stat-card .value{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600;color:var(--board);margin-top:6px;}
.stat-card .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
.stripe-amber{background:var(--amber);}
.stripe-sage{background:var(--sage);}
.stripe-rust{background:var(--rust);}
.stripe-board{background:var(--board);}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;}
.card-title{font-family:'Fraunces',serif;font-size:17px;color:var(--board);margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}

/* ---------- Stamp badge (signature element) ---------- */
.stamp{display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.06em;padding:5px 11px;border-radius:5px;border:2px solid currentColor;text-transform:uppercase;transform:rotate(-3deg);position:relative;}
.stamp::after{content:"";position:absolute;inset:2px;border:1px solid currentColor;border-radius:3px;opacity:.5;}
.stamp-paid{color:var(--sage);background:rgba(76,140,107,0.08);}
.stamp-unpaid{color:var(--rust);background:rgba(198,85,61,0.08);}
.stamp-due{color:var(--amber-dark);background:rgba(232,163,61,0.1);}

/* ---------- Batch cards ---------- */
.batch-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:box-shadow .15s, transform .1s;position:relative;overflow:hidden;}
.batch-card:hover{box-shadow:0 8px 24px rgba(31,61,51,0.12);transform:translateY(-2px);}
.batch-card .swatch{width:38px;height:38px;border-radius:9px;background:var(--board);color:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;margin-bottom:12px;}
.batch-card h3{margin:0 0 4px;font-size:16px;color:var(--ink);}
.batch-card .meta{font-size:12.5px;color:var(--ink-soft);}
.batch-card .fee-row{display:flex;gap:14px;margin-top:12px;font-size:12px;font-family:'JetBrains Mono',monospace;}
.batch-card .fee-row span.p{color:var(--sage);}
.batch-card .fee-row span.u{color:var(--rust);}

/* ---------- Student rows ---------- */
.student-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff;flex-wrap:wrap;gap:10px;}
.student-row .who{display:flex;align-items:center;gap:12px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--paper-dim);color:var(--board);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;flex-shrink:0;}
.student-row .name{font-weight:600;font-size:14.5px;}
.student-row .batchname{font-size:12px;color:var(--ink-soft);}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .12s;}
.icon-btn:hover{background:var(--paper-dim);}
.icon-btn.wa{color:#25D366;border-color:#bfe9cf;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(22,30,26,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--paper);border-radius:16px;padding:26px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,0.4);}
.modal h2{margin:0 0 18px;font-size:20px;color:var(--board);}
.modal-close{float:right;cursor:pointer;font-size:20px;color:var(--ink-soft);background:none;border:none;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.pill-group{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);font-size:13px;cursor:pointer;background:#fff;}
.pill.selected{background:var(--board);color:var(--paper);border-color:var(--board);}

/* ---------- Tabs ---------- */
.tabbar{display:flex;gap:6px;margin-bottom:20px;border-bottom:1.5px solid var(--line);}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;}
.tab.active{color:var(--board);border-color:var(--amber);}

/* ---------- Attendance dots ---------- */
.strip{display:flex;gap:4px;flex-wrap:wrap;}
.dot{width:11px;height:11px;border-radius:3px;}
.dot-present{background:var(--sage);}
.dot-absent{background:var(--rust);}
.dot-late{background:var(--amber);}
.dot-none{background:var(--line);}

.pct-badge{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;padding:4px 9px;border-radius:7px;}
.pct-good{background:rgba(76,140,107,0.12);color:var(--sage);}
.pct-mid{background:rgba(232,163,61,0.15);color:var(--amber-dark);}
.pct-low{background:rgba(198,85,61,0.12);color:var(--rust);}

.att-mark-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;}
.status-btns{display:flex;gap:6px;}
.status-btns button{border:1.5px solid var(--line);background:#fff;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}

.search-box{padding:9px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;width:220px;background:#fff;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   COACHINGPRO — data layer
============================================================ */
/* Safe storage: falls back to an in-memory store if localStorage is
   unavailable or blocked (e.g. inside a sandboxed preview), so the app
   still works for the current session even without persistence. */
const SafeStorage = {
  mem: {},
  storageOK: true,
  get(key){
    try{ return localStorage.getItem(key); }
    catch(e){ this.storageOK=false; return (key in this.mem) ? this.mem[key] : null; }
  },
  set(key, val){
    try{ localStorage.setItem(key, val); }
    catch(e){ this.storageOK=false; this.mem[key]=val; }
  }
};

const DB = {
  key: 'coachingpro_data_v1',
  load(){
    try{
      const raw = SafeStorage.get(this.key);
      if(!raw) return this.fresh();
      const parsed = JSON.parse(raw);
      // Migrate legacy single-account saves (pre multi-account support) into the new shape
      if(parsed && parsed.auth && !parsed.accounts){
        const key = parsed.auth.name.trim().toLowerCase();
        return {
          accounts: { [key]: { name: parsed.auth.name, pass: parsed.auth.pass,
            batches: parsed.batches||[], students: parsed.students||[], attendance: parsed.attendance||{} } },
          currentKey: null
        };
      }
      return parsed.accounts ? parsed : this.fresh();
    }
    catch(e){ return this.fresh(); }
  },
  fresh(){
    return { accounts:{}, currentKey:null };
  },
  save(){
    try{ SafeStorage.set(this.key, JSON.stringify(state)); }
    catch(e){ /* never let a save failure break the UI */ }
  }
};
/* Returns the data object for whichever centre is currently logged in, or null */
function acct(){ return state.currentKey ? state.accounts[state.currentKey] : null; }
/* Per-centre AI settings. Key lives only in this browser's storage — never in the source file. */
function settings(){
  const a = acct();
  if(!a) return { geminiKey:'', geminiModel:'gemini-3.6-flash' };
  if(!a.settings) a.settings = { geminiKey:'', geminiModel:'gemini-3.6-flash' };
  return a.settings;
}

/* Tests + per-student topic-wise scores, lazily initialized (safe for older saved accounts) */
function tests(){ const a=acct(); if(!a) return []; if(!a.tests) a.tests=[]; return a.tests; }
function testScores(){ const a=acct(); if(!a) return {}; if(!a.testScores) a.testScores={}; return a.testScores; }
function testById(id){ return tests().find(t=>t.id===id); }
function scoresFor(testId, studentId){
  const ts=testScores();
  if(!ts[testId]) ts[testId]={};
  return ts[testId][studentId] || null;
}
function topicStatus(pct){ return pct>=80 ? 'strong' : pct<50 ? 'weak' : 'average'; }

async function callGemini(promptText, imagePart){
  const s = settings();
  if(!s.geminiKey){ toast('Add your Gemini API key in AI Settings first'); return null; }
  const model = s.geminiModel || 'gemini-3.6-flash';
  const parts = [{ text: promptText }];
  if(imagePart) parts.push({ inlineData: { mimeType: imagePart.mimeType, data: imagePart.data } });
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': s.geminiKey },
      body: JSON.stringify({ contents:[{ role:'user', parts }] })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message || 'Gemini API error');
    const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || [])
      .map(p=>p.text||'').join('').trim();
    if(!text) throw new Error('Empty response from Gemini');
    return text;
  }catch(e){
    toast('AI error: ' + e.message);
    return null;
  }
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let state = DB.load();
let ui = { screen:'login', loginMode:'signin', activeBatch:null, activeStudent:null, sidebarOpen:false,
           feeTab:'pending', attTab:'mark', attDate: todayStr(), reportBatch:null, heatMonth: new Date().getMonth(), heatYear: new Date().getFullYear(),
           bulkQueue:null, search:'' };

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addMonths(dateStr, months){ const d=new Date(dateStr); d.setMonth(d.getMonth()+Number(months)); return d.toISOString().slice(0,10); }
function fmtDate(dstr){ if(!dstr) return '—'; const d=new Date(dstr); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function daysBetween(a,b){ return Math.ceil((new Date(b)-new Date(a))/86400000); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function computeStatus(student){
  if(!student.paymentDate) return 'unpaid';
  if(student.deadlineDate && new Date(todayStr()) > new Date(student.deadlineDate)) return 'unpaid';
  return 'paid';
}
function daysToDeadline(student){
  if(!student.deadlineDate) return null;
  return daysBetween(todayStr(), student.deadlineDate);
}
function batchById(id){ return acct().batches.find(b=>b.id===id); }
function studentsInBatch(id){ return acct().students.filter(s=>s.batchId===id); }

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}

/* ============================================================
   RENDER ROOT
============================================================ */
function render(){
  const app=document.getElementById('app');
  if(!acct()){ app.innerHTML = renderLogin(); attachLoginHandlers(); return; }
  app.innerHTML = renderShell();
  attachShellHandlers();
}

/* ---------------- LOGIN / SIGNUP ---------------- */
function renderLogin(){
  const isSignup = ui.loginMode==='signup';
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="chalk-badge">CP</div>
      <h1>${isSignup? 'Set up your centre' : 'Welcome back'}</h1>
      <p class="sub">${isSignup? 'Create an account for your coaching centre.' : 'Sign in to manage batches, fees & attendance.'}</p>
      <div class="err-box" id="loginErr"></div>
      <form id="loginForm">
        <div class="field">
          <label>Coaching Centre Name</label>
          <input id="centreName" type="text" placeholder="e.g. Bright Minds Academy" required value="${isSignup? '' : (SafeStorage.get('cp_last_name')||'')}"/>
        </div>
        <div class="field">
          <label>Password</label>
          <input id="centrePass" type="password" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-primary">${isSignup? 'Create Account' : 'Sign In'}</button>
      </form>
      <div class="login-toggle">
        ${isSignup? `Already have an account? <a id="toSignin">Sign in</a>` : `New here? <a id="toSignup">Create an account</a>`}
      </div>
    </div>
  </div>`;
}
function attachLoginHandlers(){
  const toSignup=document.getElementById('toSignup');
  const toSignin=document.getElementById('toSignin');
  if(toSignup) toSignup.onclick=()=>{ ui.loginMode='signup'; render(); };
  if(toSignin) toSignin.onclick=()=>{ ui.loginMode='signin'; render(); };
  document.getElementById('loginForm').onsubmit=(e)=>{
    e.preventDefault();
    const name=document.getElementById('centreName').value.trim();
    const pass=document.getElementById('centrePass').value;
    const errBox=document.getElementById('loginErr');
    if(!name||!pass){ errBox.style.display='block'; errBox.textContent='Please fill in both fields.'; return; }
    const key = name.toLowerCase();
    if(ui.loginMode==='signup'){
      if(state.accounts[key]){
        errBox.style.display='block'; errBox.textContent='An account with this centre name already exists. Please sign in instead.';
        return;
      }
      state.accounts[key] = { name, pass, batches:[], students:[], attendance:{} };
      state.currentKey = key;
      DB.save(); SafeStorage.set('cp_last_name', name);
      ui.screen='dashboard'; render();
    } else {
      const found = state.accounts[key];
      if(!found){
        errBox.style.display='block'; errBox.textContent='No account found with that centre name. Please create one first.';
      } else if(found.pass !== pass){
        errBox.style.display='block'; errBox.textContent='Incorrect centre name or password.';
      } else {
        state.currentKey = key;
        ui.screen='dashboard'; render();
      }
    }
  };
}

/* ---------------- SHELL ---------------- */
const NAV = [
  {id:'dashboard', label:'Dashboard', ic:'&#9679;'},
  {id:'batches', label:'Batches', ic:'&#9632;'},
  {id:'students', label:'Students', ic:'&#9673;'},
  {id:'fees', label:'Fee Management', ic:'&#8377;'},
  {id:'attendance', label:'Attendance', ic:'&#10003;'},
  {id:'tests', label:'Tests', ic:'&#9998;'},
  {id:'settings', label:'AI Settings', ic:'&#10022;'},
];

function renderShell(){
  return `
  <div class="shell">
    ${ui.sidebarOpen? `<div class="overlay" id="ovl"></div>`:''}
    <aside class="sidebar ${ui.sidebarOpen?'open':''}">
      <div class="brand"><div class="mark">CP</div><div class="name">CoachingPro</div></div>
      <div class="centre-name">${esc(acct().name)}</div>
      ${NAV.map(n=>`<div class="nav-item ${ui.screen===n.id?'active':''}" data-nav="${n.id}"><span class="ic">${n.ic}</span>${n.label}</div>`).join('')}
      <div class="sidebar-foot">
        <button class="btn logout-btn" id="logoutBtn">Log Out</button>
      </div>
    </aside>
    <div style="flex:1;min-width:0;">
      <div class="mobile-topbar">
        <div class="brand"><div class="mark">CP</div>CoachingPro</div>
        <button class="btn btn-ghost btn-sm" id="menuBtn" style="color:var(--paper);border-color:rgba(255,255,255,0.3);">☰ Menu</button>
      </div>
      <main class="main">${renderScreen()}</main>
    </div>
  </div>
  ${renderModals()}`;
}

function renderScreen(){
  switch(ui.screen){
    case 'dashboard': return renderDashboard();
    case 'batches': return ui.activeBatch ? renderBatchDetail(ui.activeBatch) : renderBatches();
    case 'students': return renderStudentsScreen();
    case 'fees': return renderFees();
    case 'attendance': return renderAttendance();
    case 'tests': return ui.activeTest ? renderTestDetail(ui.activeTest) : renderTests();
    case 'settings': return renderSettings();
    default: return renderDashboard();
  }
}

/* ---------------- AI SETTINGS ---------------- */
function renderSettings(){
  const s = settings();
  return `
  <div class="topbar">
    <div><h1>AI Settings</h1><div class="subtitle">Powers smart WhatsApp drafts &amp; admission form scanning</div></div>
  </div>
  <div class="card" style="max-width:480px;">
    <div class="field">
      <label>Gemini API Key</label>
      <input id="geminiKeyInput" type="text" placeholder="Paste your Gemini API key" value="${esc(s.geminiKey||'')}"/>
    </div>
    <div class="field">
      <label>Model</label>
      <input id="geminiModelInput" type="text" value="${esc(s.geminiModel||'gemini-3.6-flash')}"/>
    </div>
    <button class="btn btn-primary" id="saveAiSettings">Save</button>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.5;">
      Your key is saved only in this browser, on this device — it's never written into the app's code or uploaded anywhere. If a request ever fails, double-check the key is correct and that the model name above is still supported by Google.
    </p>
  </div>
  <div class="grid grid-2" style="margin-top:18px;max-width:760px;">
    <div class="card">
      <div class="card-title">✨ AI Fee Reminders</div>
      <p style="font-size:13px;color:var(--ink-soft);">Look for the sparkle button next to any student's WhatsApp icon in Fee Management or a batch list — it drafts a natural reminder message you can edit before sending.</p>
    </div>
    <div class="card">
      <div class="card-title">📷 Scan Admission Form</div>
      <p style="font-size:13px;color:var(--ink-soft);">In "Add Student", tap "Scan Admission Form" and take a photo of a handwritten form — AI fills in the name, WhatsApp number, and fee amount for you.</p>
    </div>
  </div>`;
}

/* ---------------- TESTS ---------------- */
function renderTests(){
  const list = tests();
  return `
  <div class="topbar">
    <div><h1>Tests</h1><div class="subtitle">${list.length} test${list.length===1?'':'s'} created</div></div>
    <button class="btn btn-amber" id="addTestBtn">+ New Test</button>
  </div>
  <div class="grid grid-3">
    ${list.map(t=>{
      const b=batchById(t.batchId);
      const scored = Object.keys(testScores()[t.id]||{}).length;
      return `<div class="batch-card" data-test="${t.id}">
        <div class="swatch">${esc((t.name[0]||'T').toUpperCase())}</div>
        <h3>${esc(t.name)}</h3>
        <div class="meta">${esc(b?.name||'Unassigned batch')} · ${fmtDate(t.date)}</div>
        <div class="fee-row"><span>${t.topics.length} topic${t.topics.length===1?'':'s'}</span><span>${scored} scored</span></div>
      </div>`;
    }).join('') || `<div style="grid-column:1/-1;">${emptyState('No tests yet','Click "New Test" to set up your first one.')}</div>`}
  </div>`;
}

function renderTestDetail(testId){
  const t=testById(testId);
  if(!t){ ui.activeTest=null; return renderTests(); }
  const studs=studentsInBatch(t.batchId);
  const maxTotal=t.topics.reduce((sum,tp)=>sum+tp.max,0);
  return `
  <div class="topbar">
    <div>
      <div style="font-size:12.5px;color:var(--amber-dark);font-weight:600;cursor:pointer;margin-bottom:4px;" id="backToTests">← All Tests</div>
      <h1>${esc(t.name)}</h1>
      <div class="subtitle">${esc(batchById(t.batchId)?.name||'Unassigned')} · ${fmtDate(t.date)} · Max ${maxTotal} marks</div>
    </div>
  </div>
  <div class="card">
    ${studs.map(s=>{
      const sc=scoresFor(t.id, s.id);
      return `<div class="student-row">
        <div class="who"><div class="avatar">${esc((s.name[0]||'S').toUpperCase())}</div><div><div class="name">${esc(s.name)}</div>
          <div class="batchname">${sc? sc.total+' / '+maxTotal+' marks' : 'Not scored yet'}</div></div></div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-entermarks="${s.id}">${sc? 'Edit Marks':'Enter Marks'}</button>
          ${sc? `<button class="btn btn-amber btn-sm" data-genreport="${s.id}">📄 Report</button>` : ''}
        </div>
      </div>`;
    }).join('') || emptyState('No students in this batch','Add students to this batch first.')}
  </div>`;
}

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const totalBatches=acct().batches.length;
  const totalStudents=acct().students.length;
  const paid=acct().students.filter(s=>computeStatus(s)==='paid').length;
  const unpaid=totalStudents-paid;
  const upcoming = acct().students
    .filter(s=>{ const d=daysToDeadline(s); return computeStatus(s)==='paid' && d!==null && d<=7 && d>=0; })
    .sort((a,b)=>daysToDeadline(a)-daysToDeadline(b));

  return `
  <div class="topbar">
    <div><h1>Dashboard</h1><div class="subtitle">Overview of your coaching centre</div></div>
  </div>
  <div class="grid grid-4" style="margin-bottom:22px;">
    <div class="stat-card"><div class="stripe stripe-board"></div><div class="label">Batches</div><div class="value">${totalBatches}</div></div>
    <div class="stat-card"><div class="stripe stripe-amber"></div><div class="label">Students</div><div class="value">${totalStudents}</div></div>
    <div class="stat-card"><div class="stripe stripe-sage"></div><div class="label">Fees Paid</div><div class="value">${paid}</div></div>
    <div class="stat-card"><div class="stripe stripe-rust"></div><div class="label">Fees Pending</div><div class="value">${unpaid}</div></div>
  </div>
  ${upcoming.length? `
  <div class="reminder-banner">
    <h3>⚠ Fee deadlines within 7 days</h3>
    ${upcoming.map(s=>`<div class="reminder-item"><span>${esc(s.name)} <span style="color:var(--ink-soft);">· ${esc(batchById(s.batchId)?.name||'—')}</span></span><span class="days-left">${daysToDeadline(s)}d left</span></div>`).join('')}
  </div>`:''}
  <div class="grid grid-2">
    <div class="card">
      <div class="card-title">Recently Added Students</div>
      ${acct().students.slice(-5).reverse().map(s=>studentRowMini(s)).join('') || emptyState('No students yet','Add your first student from the Students tab.')}
    </div>
    <div class="card">
      <div class="card-title">Batches</div>
      ${acct().batches.slice(0,5).map(b=>`<div class="student-row"><div class="who"><div class="avatar">${esc(b.name[0]||'B')}</div><div><div class="name">${esc(b.name)}</div><div class="batchname">${studentsInBatch(b.id).length} students</div></div></div></div>`).join('') || emptyState('No batches yet','Create a batch to start organizing students.')}
    </div>
  </div>`;
}
function studentRowMini(s){
  const st=computeStatus(s);
  return `<div class="student-row"><div class="who"><div class="avatar">${esc(s.name[0]||'S')}</div><div><div class="name">${esc(s.name)}</div><div class="batchname">${esc(batchById(s.batchId)?.name||'Unassigned')}</div></div></div><span class="stamp ${st==='paid'?'stamp-paid':'stamp-unpaid'}">${st}</span></div>`;
}
function emptyState(title, sub){
  return `<div class="empty-state"><div class="ic">◌</div><div style="font-weight:600;color:var(--ink);">${title}</div><div style="font-size:12.5px;margin-top:4px;">${sub}</div></div>`;
}

/* ---------------- BATCHES ---------------- */
function renderBatches(){
  return `
  <div class="topbar">
    <div><h1>Batches</h1><div class="subtitle">${acct().batches.length} batch${acct().batches.length===1?'':'es'}</div></div>
    <button class="btn btn-amber" id="addBatchBtn">+ New Batch</button>
  </div>
  <div class="grid grid-3">
    ${acct().batches.map(b=>{
      const studs=studentsInBatch(b.id);
      const paid=studs.filter(s=>computeStatus(s)==='paid').length;
      const unpaid=studs.length-paid;
      return `<div class="batch-card" data-batch="${b.id}">
        <div class="swatch">${esc((b.name[0]||'B').toUpperCase())}</div>
        <h3>${esc(b.name)}</h3>
        <div class="meta">${studs.length} student${studs.length===1?'':'s'}</div>
        <div class="fee-row"><span class="p">● ${paid} paid</span><span class="u">● ${unpaid} pending</span></div>
      </div>`;
    }).join('') || `<div class="empty-state" style="grid-column:1/-1;">${emptyState('No batches yet','Click "New Batch" to create your first one.')}</div>`}
  </div>`;
}
function renderBatchDetail(batchId){
  const b=batchById(batchId);
  if(!b){ ui.activeBatch=null; return renderBatches(); }
  const studs=studentsInBatch(batchId).filter(s=> s.name.toLowerCase().includes(ui.search.toLowerCase()) );
  return `
  <div class="topbar">
    <div>
      <div style="font-size:12.5px;color:var(--amber-dark);font-weight:600;cursor:pointer;margin-bottom:4px;" id="backToBatches">← All Batches</div>
      <h1>${esc(b.name)}</h1>
      <div class="subtitle">${studentsInBatch(batchId).length} student(s) in this batch</div>
    </div>
    <div style="display:flex;gap:8px;">
      <input class="search-box" placeholder="Search student..." id="batchSearch" value="${esc(ui.search)}"/>
      <button class="btn btn-amber" id="addStudentToBatch" data-batch="${batchId}">+ Add Student</button>
    </div>
  </div>
  <div class="card">
    ${studs.map(s=>studentRowFull(s)).join('') || emptyState('No students in this batch', 'Add a student and assign them here.')}
  </div>`;
}
function studentRowFull(s){
  const st=computeStatus(s);
  const dleft=daysToDeadline(s);
  return `<div class="student-row">
    <div class="who" style="cursor:pointer;" data-openstudent="${s.id}">
      <div class="avatar">${esc((s.name[0]||'S').toUpperCase())}</div>
      <div><div class="name">${esc(s.name)}</div><div class="batchname">${esc(batchById(s.batchId)?.name||'Unassigned')} ${s.deadlineDate && st==='paid' ? '· due '+fmtDate(s.deadlineDate):''}</div></div>
    </div>
    <div class="row-actions">
      <span class="stamp ${st==='paid'?'stamp-paid':'stamp-unpaid'}">${st}</span>
      <button class="icon-btn wa" title="WhatsApp reminder" data-wa-student="${s.id}">◈</button>
      <button class="icon-btn" title="AI-drafted reminder" style="color:var(--amber-dark);border-color:#f0dca9;" data-ai-wa-student="${s.id}">✨</button>
      <button class="icon-btn" title="Edit" data-editstudent="${s.id}">✎</button>
      <button class="icon-btn" title="Delete" data-delstudent="${s.id}">✕</button>

/* Compares each student's most-recent 7 days of attendance against the
   previous 7 days to flag anyone whose attendance is trending down. */
function rangeAttendancePct(studentId, daysAgoStart, daysAgoEnd){
  let present=0, counted=0;
  for(let i=daysAgoEnd; i<=daysAgoStart; i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const day=acct().attendance[ds];
    const v = day ? day[studentId] : null;
    if(v){ counted++; if(v==='present'||v==='late') present++; }
  }
  return counted ? Math.round((present/counted)*100) : null;
}
function attendanceTrendFlags(batchId){
  const studs=studentsInBatch(batchId);
  const flags=[];
  studs.forEach(s=>{
    const recentPct=rangeAttendancePct(s.id, 6, 0);   // last 7 days
    const priorPct=rangeAttendancePct(s.id, 13, 7);   // the 7 days before that
    if(recentPct!==null && priorPct!==null && (priorPct - recentPct) >= 20){
      flags.push({ id:s.id, name:s.name, recentPct, priorPct });
    } else if(recentPct!==null && priorPct===null && recentPct < 50){
      flags.push({ id:s.id, name:s.name, recentPct, priorPct: recentPct });
    }
  });
  return flags;
}

function monthAttendanceStats(studentId, year, month){
  let present=0, absent=0, late=0;
  Object.keys(acct().attendance).forEach(dateStr=>{
    const d=new Date(dateStr);
    if(d.getFullYear()===year && d.getMonth()===month){
      const v=acct().attendance[dateStr][studentId];
      if(v==='present') present++; else if(v==='absent') absent++; else if(v==='late') late++;
    }
  });
  const total=present+absent+late;
  const pct = total? Math.round(((present+late*0.5)/total)*100) : 0;
  return {present, absent, late, pct};
}
function dayBatchPct(batchId, dateStr){
  const studs=studentsInBatch(batchId);
  if(!studs.length) return null;
  const day=acct().attendance[dateStr];
  if(!day) return null;
  let present=0, counted=0;
  studs.forEach(s=>{
    const v=day[s.id];
    if(v){ counted++; if(v==='present'||v==='late') present++; }
  });
  if(!counted) return null;
  return Math.round((present/counted)*100);
}
function renderHeatmap(batchId, year, month){
  if(!batchId) return emptyState('No batch selected','');
  const firstDay=new Date(year, month, 1);
  const daysInMonth=new Date(year, month+1, 0).getDate();
  const startOffset=firstDay.getDay();
  let cells='';
  for(let i=0;i<startOffset;i++) cells+=`<div class="heat-cell heat-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const pct=dayBatchPct(batchId, dateStr);
    let bg='#E4DCC8';
    if(pct!==null){ bg = pct>=85? 'var(--sage)' : pct>=60? 'var(--amber)' : 'var(--rust)'; }
    cells+=`<div class="heat-cell" style="background:${bg};" title="${dateStr}${pct!==null? ' — '+pct+'%':' — no data'}">${d}</div>`;
  }
  return `<div class="heatmap">${cells}</div>`;
}

function modalStudentProfile(id){
  const s=acct().students.find(x=>x.id===id);
  if(!s) return '';
  const st=computeStatus(s);
  const now=new Date();
  const strip30=[];
  for(let i=29;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const v = acct().attendance[ds] ? acct().attendance[ds][s.id] : null;
    strip30.push(v);
  }
  const allStats = (()=>{
    let present=0, absent=0, late=0;
    Object.values(acct().attendance).forEach(day=>{
      const v=day[s.id];
      if(v==='present') present++; else if(v==='absent') absent++; else if(v==='late') late++;
    });
    const total=present+absent+late;
    return {present, absent, late, pct: total? Math.round(((present+late*0.5)/total)*100):0};
  })();
  return `<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="closeModal">×</button>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
        <div class="avatar" style="width:46px;height:46px;font-size:18px;">${esc((s.name[0]||'S').toUpperCase())}</div>
        <div><h2 style="margin:0;">${esc(s.name)}</h2><div style="font-size:12.5px;color:var(--ink-soft);">${esc(batchById(s.batchId)?.name||'Unassigned')}</div></div>
      </div>
      <div style="margin:14px 0;"><span class="stamp ${st==='paid'?'stamp-paid':'stamp-unpaid'}">${st}</span>
      ${s.deadlineDate? `<span style="font-size:12.5px;color:var(--ink-soft);margin-left:10px;">${st==='paid'?'valid until':'was due'} ${fmtDate(s.deadlineDate)}</span>`:''}</div>
      <div class="grid grid-3" style="margin-bottom:16px;">
        <div class="stat-card" style="padding:12px;"><div class="label" style="font-size:10.5px;">Present</div><div class="value" style="font-size:20px;">${allStats.present}</div></div>
        <div class="stat-card" style="padding:12px;"><div class="label" style="font-size:10.5px;">Absent</div><div class="value" style="font-size:20px;">${allStats.absent}</div></div>
        <div class="stat-card" style="padding:12px;"><div class="label" style="font-size:10.5px;">Late</div><div class="value" style="font-size:20px;">${allStats.late}</div></div>
      </div>
      <div style="margin-bottom:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);">Attendance rate: <span class="pct-badge ${allStats.pct>=85?'pct-good':allStats.pct>=60?'pct-mid':'pct-low'}">${allStats.pct}%</span></div>
      <div style="margin:14px 0 4px;font-size:12px;font-weight:600;color:var(--ink-soft);">Last 30 days</div>
      <div class="strip">${strip30.map(v=>`<div class="dot ${v==='present'?'dot-present':v==='absent'?'dot-absent':v==='late'?'dot-late':'dot-none'}"></div>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:20px;">
        <button class="btn btn-amber btn-sm" id="waFromProfile" data-wa-student="${s.id}">WhatsApp Fee Reminder</button>
        <button class="btn btn-ghost btn-sm" id="editFromProfile" data-editstudent="${s.id}">Edit Details</button>
      </div>
      <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--line);">
        <div style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;">✨ Ask AI to draft a reply to a parent</div>
        <div style="display:flex;gap:8px;">
          <input class="search-box" style="flex:1;width:auto;" placeholder='e.g. "Has my child paid this month?"' id="parentQAInput" value="${ui.parentQA && ui.parentQA.studentId===s.id ? esc(ui.parentQA.question||'') : ''}"/>
          <button class="btn btn-primary btn-sm" id="askParentQA" data-student="${s.id}">${ui.parentQA && ui.parentQA.loading ? '…' : 'Draft'}</button>
        </div>
        ${ui.parentQA && ui.parentQA.studentId===s.id && !ui.parentQA.loading && ui.parentQA.text ? `
          <div class="field" style="margin-top:12px;">
            <textarea id="parentQAText" rows="4" style="width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;font-family:'Inter',sans-serif;">${esc(ui.parentQA.text)}</textarea>
          </div>
          <button class="btn btn-amber btn-sm" id="sendParentQA" data-student="${s.id}">Open WhatsApp &amp; Send</button>
        ` : ''}
      </div>
    </div>
  </div>`;
}

function modalBulkSend(){
  const q=ui.bulkQueue;
  if(!q || q.idx>=q.list.length){
    return `<div class="modal-overlay" id="modalOverlay"><div class="modal" style="text-align:center;">
      <button class="modal-close" id="closeModal">×</button>
      <h2>All done ✓</h2>
      <p style="color:var(--ink-soft);font-size:14px;">Sent (or skipped) reminders for ${q?q.list.length:0} student(s).</p>
      <button class="btn btn-primary" id="closeModal2">Close</button>
    </div></div>`;
  }
  const s=q.list[q.idx];
  const link = waLink(s.parentWhatsapp, q.buildMessage(s));
  return `<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="closeModal">×</button>
      <h2>${q.title}</h2>
      <p style="font-size:12.5px;color:var(--ink-soft);">Student ${q.idx+1} of ${q.list.length}</p>
      <div class="card" style="margin:14px 0;">
        <div style="font-weight:700;margin-bottom:6px;">${esc(s.name)}</div>
        <div style="font-size:13px;color:var(--ink-soft);white-space:pre-wrap;">${esc(q.buildMessage(s))}</div>
      </div>
      ${s.parentWhatsapp? `<a class="btn btn-amber" href="${link}" target="_blank" id="bulkSendOpen" style="display:block;text-align:center;text-decoration:none;">Open WhatsApp & Send</a>` : `<div class="err-box" style="display:block;">No WhatsApp number saved for this student.</div>`}
      <button class="btn btn-ghost" id="bulkNext" style="width:100%;margin-top:10px;">Skip / Next →</button>
    </div>
  </div>`;
}

function waLink(number, message){
  const clean = (number||'').replace(/[^0-9]/g,'');
  return `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
}

  const shareReportBtn=document.getElementById('shareReportBtn');

    const d=ui.testReport;

      catch(e){ /* user cancelled — no-op */ }

  if(clearSmartQuery) clearSmartQuery.onclick=()=>{ ui.smartQuery=null; render(); };

    el.onclick=(e)=>{ e.preventDefault(); sendFeeReminder(el.dataset.waStudent); };
  });
  document.querySelectorAll('[data-ai-wa-student]').forEach(el=>{
    el.onclick=(e)=>{ e.preventDefault(); openAiDraft(el.dataset.aiWaStudent); };
  });
  document.querySelectorAll('[data-toggle-fee]').forEach(el=>{
    el.onclick=()=>{ toggleFeeStatus(el.dataset.toggleFee); };
  });

  const addStudentToBatch=document.getElementById('addStudentToBatch');
  if(addStudentToBatch) addStudentToBatch.onclick=()=>{ ui.preselectBatch=addStudentToBatch.dataset.batch; ui.modal='addStudent'; render(); };
  const addStudentBtn=document.getElementById('addStudentBtn');
  if(addStudentBtn) addStudentBtn.onclick=()=>{ ui.preselectBatch=null; ui.modal='addStudent'; render(); };

    el.onclick=()=>{ ui.feeTab=el.dataset.feetab; render(); };
  });
  const sendAllPendingBtn=document.getElementById('sendAllPendingBtn');
  if(sendAllPendingBtn) sendAllPendingBtn.onclick=()=>{
    const pending=acct().students.filter(s=>computeStatus(s)==='unpaid');
    if(!pending.length){ toast('No pending students'); return; }
    const summary = pending.map(s=>`• ${s.name}${s.feeAmount? ' — ₹'+s.feeAmount:''}`).join('\n');

    window.open(waLink('', msg), '_blank');
  };

  /* Attendance tabs */
  document.querySelectorAll('[data-atttab]').forEach(el=>{
    el.onclick=()=>{ ui.attTab=el.dataset.atttab; render(); };
  });
  const attDatePick=document.getElementById('attDatePick');

  const reportBatchPick=document.getElementById('reportBatchPick');
  if(reportBatchPick) reportBatchPick.onchange=(e)=>{ ui.reportBatch=e.target.value; render(); };
  const reportMonthPick=document.getElementById('reportMonthPick');

  const genAttInsight=document.getElementById('genAttInsight');
  if(genAttInsight) genAttInsight.onclick=async ()=>{
    const bId = ui.reportBatch || (acct().batches[0] && acct().batches[0].id);
    const flags = attendanceTrendFlags(bId);
    ui.attInsight={ loading:true, text:null }; render();
    const list = flags.map(f=>`${f.name}: was ${f.priorPct}%, now ${f.recentPct}%`).join('; ');
    const prompt = `You are helping a coaching centre admin. These students in "${batchById(bId)?.name}" show declining attendance this week compared to last week: ${list}.
Write a short (under 50 words), practical note to the admin summarizing this and suggesting one concrete next step (e.g. follow up with parents). No greeting, just the note.`;

    ui.attInsight={ loading:false, text }; render();
  };

  document.querySelectorAll('[data-mark]').forEach(el=>{

      const sid=el.dataset.mark, val=el.dataset.val;

      acct().attendance[ui.attDate][sid] = (acct().attendance[ui.attDate][sid]===val) ? undefined : val;
      if(acct().attendance[ui.attDate][sid]===undefined) delete acct().attendance[ui.attDate][sid];
      DB.save(); render();
    };
  });

  const sendDailyReportBtn=document.getElementById('sendDailyReportBtn');
  if(sendDailyReportBtn) sendDailyReportBtn.onclick=()=>{
    const bId = ui.reportBatch || (acct().batches[0] && acct().batches[0].id);

        const v=acct().attendance[ui.attDate][s.id];

    DB.save(); closeModal(); toast('Batch created'); render();

  document.querySelectorAll('[data-dur]').forEach(el=>{
    el.onclick=()=>{
      document.querySelectorAll('[data-dur]').forEach(p=>p.classList.remove('selected'));
      el.classList.add('selected');
      const payDate=document.getElementById('sPayDate').value || todayStr();
      document.getElementById('sDeadline').value = addMonths(payDate, el.dataset.dur);
    };
  });

  const ocrFileInput=document.getElementById('ocrFileInput');
  if(ocrFileInput) ocrFileInput.onchange=async ()=>{
    const file=ocrFileInput.files[0];
    if(!file) return;
    const statusEl=document.getElementById('ocrStatus');
    statusEl.textContent='Reading form…';
    try{
      const base64=await fileToBase64(file);
      const prompt=`This image is a handwritten or printed student admission/enrollment form for a coaching centre. Extract the following fields and respond with ONLY raw JSON, no markdown fences, no explanation:
{"name": "student's full name or empty string", "parentWhatsapp": "phone number digits only, include country code if visible, else empty string", "feeAmount": "fee amount as a number only, or empty string"}`;
      const result=await callGemini(prompt, { mimeType:file.type||'image/jpeg', data:base64 });
      if(!result){ statusEl.textContent='Could not read the form. You can still fill in the details manually.'; return; }
      let cleaned=result.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(cleaned);
      if(parsed.name) document.getElementById('sName').value=parsed.name;
      if(parsed.parentWhatsapp) document.getElementById('sWhatsapp').value=String(parsed.parentWhatsapp).replace(/[^0-9]/g,'');
      if(parsed.feeAmount) document.getElementById('sFee').value=String(parsed.feeAmount).replace(/[^0-9.]/g,'');
      statusEl.textContent='Filled in from the form — please double-check before saving.';
    }catch(e){
      statusEl.textContent='Could not read the form clearly. Please fill in the details manually.';
    }
  };

  const studentForm=document.getElementById('studentForm');
  if(studentForm) studentForm.onsubmit=(e)=>{
    e.preventDefault();
    const name=document.getElementById('sName').value.trim();
    const batchId=document.getElementById('sBatch').value;

    const paymentDate=document.getElementById('sPayDate').value;
    const deadlineDate=document.getElementById('sDeadline').value;
    const durEl=document.querySelector('[data-dur].selected');

      toast('Student updated');
    } else {
      acct().students.push({id:uid(), name, batchId, parentWhatsapp, feeAmount, paymentDate, deadlineDate, durationMonths});
      toast('Student added');
    }
    DB.save(); closeModal(); render();
  };

  const waFromProfile=document.getElementById('waFromProfile');
  if(waFromProfile) waFromProfile.onclick=(e)=>{ e.preventDefault(); sendFeeReminder(waFromProfile.dataset.waStudent); };
  const editFromProfile=document.getElementById('editFromProfile');
  if(editFromProfile) editFromProfile.onclick=()=>{ ui.editingStudent=acct().students.find(s=>s.id===editFromProfile.dataset.editstudent); ui.modal='editStudent'; render(); };

  const askParentQA=document.getElementById('askParentQA');
  if(askParentQA) askParentQA.onclick=()=>{
    const question=document.getElementById('parentQAInput').value.trim();
    if(question) generateParentReply(askParentQA.dataset.student, question);
  };
  const sendParentQA=document.getElementById('sendParentQA');
  if(sendParentQA) sendParentQA.onclick=()=>{
    const s=acct().students.find(x=>x.id===sendParentQA.dataset.student);
    const editedText=document.getElementById('parentQAText').value;
    if(!s.parentWhatsapp){ toast('No WhatsApp number saved for this student'); return; }
    window.open(waLink(s.parentWhatsapp, editedText), '_blank');
  };

  const bulkNext=document.getElementById('bulkNext');
  if(bulkNext) bulkNext.onclick=()=>{ ui.bulkQueue.idx++; render(); };

  const aiRegenerate=document.getElementById('aiRegenerate');
  if(aiRegenerate) aiRegenerate.onclick=()=>{ generateAiDraft(ui.aiDraft.studentId); };
  const aiSendWa=document.getElementById('aiSendWa');
  if(aiSendWa) aiSendWa.onclick=()=>{
    const s=acct().students.find(x=>x.id===ui.aiDraft.studentId);
    const editedText=document.getElementById('aiDraftText').value;
    if(!s.parentWhatsapp){ toast('No WhatsApp number saved for this student'); return; }
    window.open(waLink(s.parentWhatsapp, editedText), '_blank');
    closeModal();
  };
}

function closeModal(){ ui.modal=null; ui.editingStudent=null; ui.aiDraft=null; ui.parentQA=null; ui.enterMarksDraft=null; ui.testReport=null; render(); }

function readTopicRowsFromDOM(){
  const rows=[...document.querySelectorAll('#topicRows [data-topicrow]')];
  return rows.map(r=>({
    name: r.querySelector('.topic-name').value.trim(),
    max: Number(r.querySelector('.topic-max').value) || 0
  }));
}

/* Captures every field of the New Test form (not just topics) into ui.newTestDraft
   before a re-render, so adding/removing a topic row never wipes what's already typed. */
function syncNewTestDraftFromDOM(){
  const nameEl=document.getElementById('testNameInput');
  const batchEl=document.getElementById('testBatchInput');
  const dateEl=document.getElementById('testDateInput');
  ui.newTestDraft.name = nameEl ? nameEl.value : ui.newTestDraft.name;
  ui.newTestDraft.batchId = batchEl ? batchEl.value : ui.newTestDraft.batchId;

}

async function generateTestReport(testId, studentId){
  const t=testById(testId);
  const s=acct().students.find(x=>x.id===studentId);
  const sc=scoresFor(testId, studentId);
  if(!t || !s || !sc){ toast('Enter marks first'); return; }

  ui.modal='testReport';
  ui.testReport={ status:'generating', statusText:'Analyzing performance…' };
  render();

  const topicResults = t.topics.map(tp=>{
    const score = sc.topicScores[tp.name] != null ? sc.topicScores[tp.name] : 0;
    const pct = tp.max ? Math.round((score/tp.max)*100) : 0;
    return { name:tp.name, max:tp.max, score, pct, status: topicStatus(pct) };
  });
  const weak = topicResults.filter(r=>r.status==='weak');
  const strong = topicResults.filter(r=>r.status==='strong');

  let practiceQuestions = {};
  if(weak.length && settings().geminiKey){
    ui.testReport={ status:'generating', statusText:'Generating practice questions for weak topics…' };
    render();
    const prompt = `A student took a test called "${t.name}" and scored weakly in these topics: ${weak.map(w=>w.name+' ('+w.pct+'%)').join(', ')}.
For EACH weak topic, write exactly 2 short practice questions suitable for a school/coaching-centre student at that level. Respond with ONLY raw JSON (no markdown fences), shape: {"TopicName": ["question 1", "question 2"]} using the exact topic names given.`;
    const result = await callGemini(prompt);
    if(result){
      try{ practiceQuestions = JSON.parse(result.replace(/```json|```/g,'').trim()); }
      catch(e){ practiceQuestions = {}; }
    }
  }

  ui.testReport={ status:'generating', statusText:'Building PDF…' };
  render();

  try{
    if(!window.jspdf) throw new Error('PDF library did not load — check your internet connection and reload the page.');
    const pdfBlob = buildTestReportPdf(t, s, topicResults, weak, strong, practiceQuestions);
    ui.testReport={ status:'ready', studentName:s.name, testName:t.name, weak, strong, pdfBlob };
    render();
  }catch(e){
    ui.testReport={ status:'error', errorText:'Could not build the PDF: '+e.message };
    render();
  }
}

function buildTestReportPdf(test, student, topicResults, weak, strong, practiceQuestions){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = 20;

  doc.setFontSize(18);
  doc.setTextColor(31,61,51);
  doc.text(acct().name, 14, y); y+=8;
  doc.setFontSize(13);
  doc.setTextColor(90,90,90);
  doc.text('Test Report', 14, y); y+=8;
  doc.setDrawColor(228,220,200);
  doc.line(14, y, pageWidth-14, y); y+=10;

  doc.setFontSize(11);
  doc.setTextColor(30,30,30);
  doc.text('Student: ' + student.name, 14, y); y+=7;
  doc.text('Test: ' + test.name, 14, y); y+=7;
  doc.text('Date: ' + fmtDate(test.date), 14, y); y+=7;
  const totalScore = topicResults.reduce((a,r)=>a+r.score,0);
  const totalMax = topicResults.reduce((a,r)=>a+r.max,0);
  doc.setFont(undefined,'bold');
  doc.text('Total Score: ' + totalScore + ' / ' + totalMax, 14, y);
  doc.setFont(undefined,'normal');
  y+=12;

  doc.setFontSize(10);
  doc.setFillColor(31,61,51);
  doc.setTextColor(255,255,255);
  doc.rect(14, y, pageWidth-28, 8, 'F');
  doc.text('Topic', 18, y+5.5);
  doc.text('Marks', pageWidth-72, y+5.5);
  doc.text('%', pageWidth-46, y+5.5);
  doc.text('Status', pageWidth-30, y+5.5);
  y+=8;

  topicResults.forEach(r=>{
    const rc = r.status==='weak' ? [251,232,228] : r.status==='strong' ? [230,242,235] : [244,242,232];
    doc.setFillColor(rc[0], rc[1], rc[2]);
    doc.rect(14, y, pageWidth-28, 8, 'F');
    doc.setTextColor(30,30,30);
    doc.text(String(r.name).slice(0,32), 18, y+5.5);
    doc.text(r.score + '/' + r.max, pageWidth-72, y+5.5);
    doc.text(r.pct + '%', pageWidth-46, y+5.5);
    doc.text(r.status, pageWidth-30, y+5.5);
    y+=8;
  });
  y+=10;

  if(weak.length){
    doc.setFontSize(13);
    doc.setTextColor(198,85,61);
    doc.text('Weak Topics — Practice Questions', 14, y); y+=9;
    doc.setFontSize(10.5);
    doc.setTextColor(30,30,30);
    weak.forEach(w=>{
      if(y > 270){ doc.addPage(); y=20; }
      doc.setFont(undefined,'bold');
      doc.text(w.name + ' (' + w.pct + '%)', 14, y); y+=6;
      doc.setFont(undefined,'normal');
      const qs = practiceQuestions[w.name] || [];
      if(!qs.length){
        doc.text('• Review this topic with your teacher for targeted practice.', 18, y); y+=6;
      }
      qs.forEach(q=>{
        const lines = doc.splitTextToSize('• ' + q, pageWidth-32);
        lines.forEach(line=>{
          if(y > 275){ doc.addPage(); y=20; }
          doc.text(line, 18, y); y+=6;
        });
      });
      y+=4;
    });
  }

  if(strong.length){
    if(y > 260){ doc.addPage(); y=20; }
    doc.setFontSize(13);
    doc.setTextColor(76,140,107);
    doc.text('Strong Topics', 14, y); y+=9;
    doc.setFontSize(10.5);
    doc.setTextColor(30,30,30);
    strong.forEach(s=>{
      if(y > 275){ doc.addPage(); y=20; }
      doc.text('• ' + s.name + ' (' + s.pct + '%)', 14, y); y+=6;
    });
  }

  return doc.output('blob');
}

async function generateParentReply(studentId, question){
  ui.parentQA={ studentId, question, loading:true, text:null };
  render();
  const s=acct().students.find(x=>x.id===studentId);
  if(!s){ ui.parentQA=null; render(); return; }
  const st=computeStatus(s);
  const stat=(()=>{ const now=new Date(); return monthAttendanceStats(s.id, now.getFullYear(), now.getMonth()); })();
  const context = `Student: ${s.name}, Batch: ${batchById(s.batchId)?.name||'Unassigned'}.
Fee status: ${st}${s.deadlineDate? (st==='paid'? ', valid until '+fmtDate(s.deadlineDate) : ', was due '+fmtDate(s.deadlineDate)) : ''}${s.feeAmount? ', amount ₹'+s.feeAmount:''}.
This month's attendance: ${stat.present} present, ${stat.absent} absent, ${stat.late} late (${stat.pct}%).`;
  const prompt = `You are drafting a WhatsApp reply from "${acct().name}" coaching centre to a parent. Here is the student's data:
${context}
The parent asked: "${question}"
Write a short (under 50 words), warm, factual WhatsApp reply using only the data above. No emojis, no greeting placeholder — just "Dear Parent,". Output only the message text.`;
  const text = await callGemini(prompt);
  if(ui.parentQA===null || ui.parentQA.studentId!==studentId) return;
  ui.parentQA={ studentId, question, loading:false, text };
  render();
}

async function runSmartSearch(queryText){
  ui.smartQuery={ text:queryText, loading:true, results:[], error:null };
  render();
  const batchNames = acct().batches.map(b=>b.name);
  const prompt = `You convert a coaching-centre admin's plain-language question into a JSON filter. Available batch names: ${JSON.stringify(batchNames)}.
Question: "${queryText}"
Respond with ONLY raw JSON (no markdown fences), using this exact shape, with null for anything not mentioned:
{"batchName": string or null, "feeStatus": "paid" or "unpaid" or null, "maxAttendancePct": number or null, "minAbsencesThisMonth": number or null, "minDaysOverdue": number or null}`;
  const result = await callGemini(prompt);
  if(!result){ ui.smartQuery={ text:queryText, loading:false, results:[], error:'Could not run that search — check your API key in AI Settings.' }; render(); return; }
  let filter;
  try{ filter = JSON.parse(result.replace(/```json|```/g,'').trim()); }
  catch(e){ ui.smartQuery={ text:queryText, loading:false, results:[], error:'Could not understand that question — try rephrasing.' }; render(); return; }

  const now=new Date();
  const results = acct().students.filter(s=>{
    if(filter.batchName){
      const b=batchById(s.batchId);
      if(!b || b.name.toLowerCase()!==String(filter.batchName).toLowerCase()) return false;
    }
    if(filter.feeStatus && computeStatus(s)!==filter.feeStatus) return false;
    if(filter.maxAttendancePct!=null){
      const stat=monthAttendanceStats(s.id, now.getFullYear(), now.getMonth());
      if(stat.pct > filter.maxAttendancePct) return false;
    }
    if(filter.minAbsencesThisMonth!=null){
      const stat=monthAttendanceStats(s.id, now.getFullYear(), now.getMonth());
      if(stat.absent < filter.minAbsencesThisMonth) return false;
    }
    if(filter.minDaysOverdue!=null){
      const d=daysToDeadline(s);
      const overdue = (computeStatus(s)==='unpaid' && d!==null) ? -d : 0;
      if(overdue < filter.minDaysOverdue) return false;
    }
    return true;
  });
  ui.smartQuery={ text:queryText, loading:false, results, error:null };
  render();
}

function openAiDraft(studentId){
  ui.modal='aiDraft';
  ui.aiDraft={ studentId, loading:true, text:null };
  render();
  generateAiDraft(studentId);
}

async function generateAiDraft(studentId){
  ui.aiDraft={ studentId, loading:true, text:null };
  render();
  const s=acct().students.find(x=>x.id===studentId);
  if(!s){ ui.aiDraft={studentId, loading:false, text:null}; render(); return; }
  const st=computeStatus(s);
  const dleft=daysToDeadline(s);
  const context = st==='unpaid'
    ? `The student's fee is currently PENDING/OVERDUE.${s.deadlineDate? ' It was due on '+fmtDate(s.deadlineDate)+'.' : ''}`
    : `The student's fee is PAID and valid until ${fmtDate(s.deadlineDate)}${dleft!==null? ' ('+dleft+' days from now)':''}. This is a friendly upcoming-renewal reminder.`;
  const prompt = `Write a short, warm, professional WhatsApp message (under 60 words) from "${acct().name}" coaching centre to a parent, about their child ${s.name}'s tuition fee.
${context}
${s.feeAmount? 'Fee amount: ₹'+s.feeAmount+'.' : ''}
Tone: polite and respectful, not pushy. No emojis. Do not include a greeting placeholder like [Parent Name] — just address them generally as "Dear Parent". Output only the message text, nothing else.`;
  const text = await callGemini(prompt);
  if(ui.modal!=='aiDraft') return; // user navigated away while waiting
  ui.aiDraft={ studentId, loading:false, text };
  render();
}

function sendFeeReminder(studentId){
  const s=acct().students.find(x=>x.id===studentId);
  if(!s) return;
  if(!s.parentWhatsapp){ toast('No WhatsApp number saved for this student'); return; }
  const st=computeStatus(s);
  const msg = st==='unpaid'
    ? `Fee Reminder\n\nDear Parent, the fee for ${s.name}${s.feeAmount? ' (₹'+s.feeAmount+')':''} is pending${s.deadlineDate? ' (was due '+fmtDate(s.deadlineDate)+')':''}. Kindly clear the dues at the earliest.\n\n— ${acct().name}`
    : `Fee Reminder\n\nDear Parent, this is a reminder that ${s.name}'s fee${s.feeAmount? ' (₹'+s.feeAmount+')':''} is valid until ${fmtDate(s.deadlineDate)}. Please renew before the deadline.\n\n— ${acct().name}`;
  window.open(waLink(s.parentWhatsapp, msg), '_blank');
}

function toggleFeeStatus(studentId){
  const s=acct().students.find(x=>x.id===studentId);
  if(!s) return;
  const st=computeStatus(s);
  if(st==='unpaid'){
    s.paymentDate=todayStr();
    const dur = s.durationMonths || 1;
    s.deadlineDate=addMonths(s.paymentDate, dur);
    s.durationMonths=dur;
    toast('Marked as paid today');
  } else {
    s.paymentDate=null; s.deadlineDate=null;
    toast('Marked as unpaid');
  }
  DB.save(); render();
}
