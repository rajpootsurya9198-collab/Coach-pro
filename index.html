<style>
:root{
  --board:#1F3D33;
  --board-dark:#16302A;
  --paper:#FBF7EE;
  --paper-dim:#F1ECDD;
  --amber:#E8A33D;
  --amber-dark:#C9832A;
  --rust:#C6553D;
  --sage:#4C8C6B;
  --ink:#2B2B3D;
  --ink-soft:#5C5C6E;
  --line:#E4DCC8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* ---------- Layout ---------- */
#app{min-height:100vh;}
.hidden{display:none !important;}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, rgba(232,163,61,0.12), transparent 40%),
  radial-gradient(circle at 80% 80%, rgba(76,140,107,0.10), transparent 40%),
  var(--board);
  padding:24px;}
.login-card{background:var(--paper);width:100%;max-width:400px;border-radius:18px;padding:38px 32px;box-shadow:0 30px 60px rgba(0,0,0,0.35);position:relative;overflow:hidden;}
.login-card::before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:var(--amber);opacity:0.15;border-radius:50%;}
.chalk-badge{width:52px;height:52px;border-radius:12px;background:var(--board);display:flex;align-items:center;justify-content:center;color:var(--amber);font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-bottom:18px;}
.login-card h1{font-size:26px;margin:0 0 4px;color:var(--board);}
.login-card p.sub{color:var(--ink-soft);margin:0 0 26px;font-size:14px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);outline:none;transition:border-color .15s;}
.field input:focus, .field select:focus{border-color:var(--amber);}
.btn{cursor:pointer;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:11px 18px;transition:transform .1s, box-shadow .15s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--board);color:var(--paper);width:100%;}
.btn-primary:hover{background:var(--board-dark);}
.btn-amber{background:var(--amber);color:var(--board);}
.btn-amber:hover{background:var(--amber-dark);}
.btn-ghost{background:transparent;color:var(--board);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--board);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
.login-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);}
.login-toggle a{color:var(--amber-dark);cursor:pointer;font-weight:600;text-decoration:none;}
.err-box{background:#FBE8E4;color:var(--rust);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none;}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--board);color:var(--paper);flex-shrink:0;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px;}
.sidebar .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--amber);color:var(--board);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;}
.sidebar .brand .name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
.sidebar .centre-name{font-size:11.5px;color:#9FC2B3;padding:0 8px 18px;letter-spacing:.02em;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#CFE3D9;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:3px;transition:background .12s;}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:var(--amber);color:var(--board);font-weight:700;}
.nav-item .ic{width:18px;text-align:center;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.12);}
.logout-btn{width:100%;background:rgba(255,255,255,0.08);color:#F1E3C8;}
.logout-btn:hover{background:rgba(255,255,255,0.15);}

.main{flex:1;padding:28px 32px 60px;max-width:1200px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
.topbar h1{margin:0;font-size:26px;color:var(--board);}
.topbar .subtitle{color:var(--ink-soft);font-size:13.5px;margin-top:3px;}
  
/* mobile */
.mobile-topbar{display:none;}
@media(max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{display:none;}
  .sidebar.open{display:flex;position:fixed;z-index:40;width:230px;box-shadow:0 0 40px rgba(0,0,0,0.4);}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--board);color:var(--paper);padding:14px 16px;position:sticky;top:0;z-index:30;}
  .mobile-topbar .brand{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;}
  .mobile-topbar .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--amber);color:var(--board);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .main{padding:20px 16px 60px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:35;}
}

/* ---------- Cards / stats ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:860px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;}
.stat-card .label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
.stat-card .value{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600;color:var(--board);margin-top:6px;}
.stat-card .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
.stripe-amber{background:var(--amber);}
.stripe-sage{background:var(--sage);}
.stripe-rust{background:var(--rust);}
.stripe-board{background:var(--board);}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;}
.card-title{font-family:'Fraunces',serif;font-size:17px;color:var(--board);margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}

/* ---------- Stamp badge (signature element) ---------- */
.stamp{display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.06em;padding:5px 11px;border-radius:5px;border:2px solid currentColor;text-transform:uppercase;transform:rotate(-3deg);position:relative;}
.stamp::after{content:"";position:absolute;inset:2px;border:1px solid currentColor;border-radius:3px;opacity:.5;}
.stamp-paid{color:var(--sage);background:rgba(76,140,107,0.08);}
.stamp-unpaid{color:var(--rust);background:rgba(198,85,61,0.08);}
.stamp-due{color:var(--amber-dark);background:rgba(232,163,61,0.1);}

/* ---------- Batch cards ---------- */
.batch-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:box-shadow .15s, transform .1s;position:relative;overflow:hidden;}
.batch-card:hover{box-shadow:0 8px 24px rgba(31,61,51,0.12);transform:translateY(-2px);}
.batch-card .swatch{width:38px;height:38px;border-radius:9px;background:var(--board);color:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;margin-bottom:12px;}
.batch-card h3{margin:0 0 4px;font-size:16px;color:var(--ink);}
.batch-card .meta{font-size:12.5px;color:var(--ink-soft);}
.batch-card .fee-row{display:flex;gap:14px;margin-top:12px;font-size:12px;font-family:'JetBrains Mono',monospace;}
.batch-card .fee-row span.p{color:var(--sage);}
.batch-card .fee-row span.u{color:var(--rust);}

/* ---------- Student rows ---------- */
.student-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff;flex-wrap:wrap;gap:10px;}
.student-row .who{display:flex;align-items:center;gap:12px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--paper-dim);color:var(--board);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;flex-shrink:0;}
.student-row .name{font-weight:600;font-size:14.5px;}
.student-row .batchname{font-size:12px;color:var(--ink-soft);}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .12s;}
.icon-btn:hover{background:var(--paper-dim);}
.icon-btn.wa{color:#25D366;border-color:#bfe9cf;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(22,30,26,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--paper);border-radius:16px;padding:26px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,0.4);}
.modal h2{margin:0 0 18px;font-size:20px;color:var(--board);}
.modal-close{float:right;cursor:pointer;font-size:20px;color:var(--ink-soft);background:none;border:none;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.pill-group{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);font-size:13px;cursor:pointer;background:#fff;}
.pill.selected{background:var(--board);color:var(--paper);border-color:var(--board);}

/* ---------- Tabs ---------- */
.tabbar{display:flex;gap:6px;margin-bottom:20px;border-bottom:1.5px solid var(--line);}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;}
.tab.active{color:var(--board);border-color:var(--amber);}

/* ---------- Attendance dots ---------- */
.strip{display:flex;gap:4px;flex-wrap:wrap;}
.dot{width:11px;height:11px;border-radius:3px;}
.dot-present{background:var(--sage);}
.dot-absent{background:var(--rust);}
.dot-late{background:var(--amber);}
.dot-none{background:var(--line);}

.pct-badge{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;padding:4px 9px;border-radius:7px;}
.pct-good{background:rgba(76,140,107,0.12);color:var(--sage);}
.pct-mid{background:rgba(232,163,61,0.15);color:var(--amber-dark);}
.pct-low{background:rgba(198,85,61,0.12);color:var(--rust);}

.att-mark-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;}
.status-btns{display:flex;gap:6px;}
.status-btns button{border:1.5px solid var(--line);background:#fff;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.status-btns button.active-present{background:var(--sage);color:#fff;border-color:var(--sage);}
.status-btns button.active-absent{background:var(--rust);color:#fff;border-color:var(--rust);}
.status-btns button.active-late{background:var(--amber);color:var(--board);border-color:var(--amber);}

/* Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.heat-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:'JetBrains Mono',monospace;color:#fff;}
.heat-empty{background:transparent;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}

.reminder-banner{background:linear-gradient(135deg, rgba(232,163,61,0.14), rgba(198,85,61,0.08));border:1.5px solid rgba(232,163,61,0.4);border-radius:14px;padding:16px 18px;margin-bottom:22px;}
.reminder-banner h3{margin:0 0 10px;font-size:15px;color:var(--amber-dark);display:flex;align-items:center;gap:8px;}
.reminder-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed rgba(232,163,61,0.35);font-size:13.5px;}
.reminder-item:first-of-type{border-top:none;}
.days-left{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--rust);font-size:12px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--board);color:var(--paper);padding:12px 20px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.3);}

.search-box{padding:9px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;width:220px;background:#fff;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   COACHINGPRO — data layer
============================================================ */
/* Safe storage: falls back to an in-memory store if localStorage is
   unavailable or blocked (e.g. inside a sandboxed preview), so the app
   still works for the current session even without persistence. */
const SafeStorage = {
  mem: {},
  storageOK: true,
  get(key){
    try{ return localStorage.getItem(key); }
    catch(e){ this.storageOK=false; return (key in this.mem) ? this.mem[key] : null; }
  },
  set(key, val){
    try{ localStorage.setItem(key, val); }
    catch(e){ this.storageOK=false; this.mem[key]=val; }
  }
};

const DB = {
  key: 'coachingpro_data_v1',
  load(){
    try{
      const raw = SafeStorage.get(this.key);
      return raw ? JSON.parse(raw) : this.fresh();
    }
    catch(e){ return this.fresh(); }
  },
  fresh(){
    return { auth:null, batches:[], students:[], attendance:{} };
  },
  save(){
    try{ SafeStorage.set(this.key, JSON.stringify(state)); }
    catch(e){ /* never let a save failure break the UI */ }
  }
};

let state = DB.load();
let ui = { screen:'login', loginMode:'signin', activeBatch:null, activeStudent:null, sidebarOpen:false,
           feeTab:'pending', attTab:'mark', attDate: todayStr(), reportBatch:null, heatMonth: new Date().getMonth(), heatYear: new Date().getFullYear(),
           bulkQueue:null, search:'' };

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addMonths(dateStr, months){ const d=new Date(dateStr); d.setMonth(d.getMonth()+Number(months)); return d.toISOString().slice(0,10); }
function fmtDate(dstr){ if(!dstr) return '—'; const d=new Date(dstr); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function daysBetween(a,b){ return Math.ceil((new Date(b)-new Date(a))/86400000); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function computeStatus(student){
  if(!student.paymentDate) return 'unpaid';
  if(student.deadlineDate && new Date(todayStr()) > new Date(student.deadlineDate)) return 'unpaid';
  return 'paid';
}
function daysToDeadline(student){
  if(!student.deadlineDate) return null;
  return daysBetween(todayStr(), student.deadlineDate);
}
function batchById(id){ return state.batches.find(b=>b.id===id); }
function studentsInBatch(id){ return state.students.filter(s=>s.batchId===id); }

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}

/* ============================================================
   RENDER ROOT
============================================================ */
function render(){
  const app=document.getElementById('app');
  if(!state.auth){ app.innerHTML = renderLogin(); attachLoginHandlers(); return; }
  app.innerHTML = renderShell();
  attachShellHandlers();
}

/* ---------------- LOGIN / SIGNUP ---------------- */
function renderLogin(){
  const isSignup = ui.loginMode==='signup';
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="chalk-badge">CP</div>
      <h1>${isSignup? 'Set up your centre' : 'Welcome back'}</h1>
      <p class="sub">${isSignup? 'Create an account for your coaching centre.' : 'Sign in to manage batches, fees & attendance.'}</p>
      <div class="err-box" id="loginErr"></div>
      <form id="loginForm">
        <div class="field">
          <label>Coaching Centre Name</label>
          <input id="centreName" type="text" placeholder="e.g. Bright Minds Academy" required value="${isSignup? '' : (SafeStorage.get('cp_last_name')||'')}"/>
        </div>
        <div class="field">
          <label>Password</label>
          <input id="centrePass" type="password" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-primary">${isSignup? 'Create Account' : 'Sign In'}</button>
      </form>
      <div class="login-toggle">
        ${isSignup? `Already have an account? <a id="toSignin">Sign in</a>` : `New here? <a id="toSignup">Create an account</a>`}
      </div>
    </div>
  </div>`;
}
function attachLoginHandlers(){
  const toSignup=document.getElementById('toSignup');
  const toSignin=document.getElementById('toSignin');
  if(toSignup) toSignup.onclick=()=>{ ui.loginMode='signup'; render(); };
  if(toSignin) toSignin.onclick=()=>{ ui.loginMode='signin'; render(); };
  document.getElementById('loginForm').onsubmit=(e)=>{
    e.preventDefault();
    const name=document.getElementById('centreName').value.trim();
    const pass=document.getElementById('centrePass').value;
    const errBox=document.getElementById('loginErr');
    if(!name||!pass){ errBox.style.display='block'; errBox.textContent='Please fill in both fields.'; return; }
    if(ui.loginMode==='signup'){
      state.auth={ name, pass };
      DB.save(); SafeStorage.set('cp_last_name', name);
      ui.screen='dashboard'; render();
    } else {
      let saved=null;
      try{ const raw=SafeStorage.get(DB.key); saved = raw? JSON.parse(raw) : null; }catch(e){ saved=null; }
      if(!saved && state.auth) saved = state; // fall back to in-memory state (e.g. storage blocked this session)
      if(saved && saved.auth && saved.auth.name.toLowerCase()===name.toLowerCase() && saved.auth.pass===pass){
        state=saved; ui.screen='dashboard'; render();
      } else if(!saved || !saved.auth){
        errBox.style.display='block'; errBox.textContent='No account found. Please create one first.';
      } else {
        errBox.style.display='block'; errBox.textContent='Incorrect centre name or password.';
      }
    }
  };
}

/* ---------------- SHELL ---------------- */
const NAV = [
  {id:'dashboard', label:'Dashboard', ic:'&#9679;'},
  {id:'batches', label:'Batches', ic:'&#9632;'},
  {id:'students', label:'Students', ic:'&#9673;'},
  {id:'fees', label:'Fee Management', ic:'&#8377;'},
  {id:'attendance', label:'Attendance', ic:'&#10003;'},
];

function renderShell(){
  return `
  <div class="shell">
    ${ui.sidebarOpen? `<div class="overlay" id="ovl"></div>`:''}
    <aside class="sidebar ${ui.sidebarOpen?'open':''}">
      <div class="brand"><div class="mark">CP</div><div class="name">CoachingPro</div></div>
      <div class="centre-name">${esc(state.auth.name)}</div>
      ${NAV.map(n=>`<div class="nav-item ${ui.screen===n.id?'active':''}" data-nav="${n.id}"><span class="ic">${n.ic}</span>${n.label}</div>`).join('')}
      <div class="sidebar-foot">
        <button class="btn logout-btn" id="logoutBtn">Log Out</button>
      </div>
    </aside>
    <div style="flex:1;min-width:0;">
      <div class="mobile-topbar">
        <div class="brand"><div class="mark">CP</div>CoachingPro</div>
        <button class="btn btn-ghost btn-sm" id="menuBtn" style="color:var(--paper);border-color:rgba(255,255,255,0.3);">☰ Menu</button>
      </div>
      <main class="main">${renderScreen()}</main>
    </div>
  </div>
  ${renderModals()}`;
}

function renderScreen(){
  switch(ui.screen){
    case 'dashboard': return renderDashboard();
    case 'batches': return ui.activeBatch ? renderBatchDetail(ui.activeBatch) : renderBatches();
    case 'students': return renderStudentsScreen();
    case 'fees': return renderFees();
    case 'attendance': return renderAttendance();
    default: return renderDashboard();
  }
}

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const totalBatches=state.batches.length;
  const totalStudents=state.students.length;
  const paid=state.students.filter(s=>computeStatus(s)==='paid').length;
  const unpaid=totalStudents-paid;
  const upcoming = state.students
    .filter(s=>{ const d=daysToDeadline(s); return computeStatus(s)==='paid' && d!==null && d<=7 && d>=0; })
    .sort((a,b)=>daysToDeadline(a)-daysToDeadline(b));

  return `
  <div class="topbar">
    <div><h1>Dashboard</h1><div class="subtitle">Overview of your coaching centre</div></div>
  </div>
  <div class="grid grid-4" style="margin-bottom:22px;">
    <div class="stat-card"><div class="stripe stripe-board"></div><div class="label">Batches</div><div class="value">${totalBatches}</div></div>
    <div class="stat-card"><div class="stripe stripe-amber"></div><div class="label">Students</div><div class="value">${totalStudents}</div></div>
    <div class="stat-card"><div class="stripe stripe-sage"></div><div class="label">Fees Paid</div><div class="value">${paid}</div></div>
    <div class="stat-card"><div class="stripe stripe-rust"></div><div class="label">Fees Pending</div><div class="value">${unpaid}</div></div>
  </div>
  ${upcoming.length? `
  <div class="reminder-banner">
    <h3>⚠ Fee deadlines within 7 days</h3>
    ${upcoming.map(s=>`<div class="reminder-item"><span>${esc(s.name)} <span style="color:var(--ink-soft);">· ${esc(batchById(s.batchId)?.name||'—')}</span></span><span class="days-left">${daysToDeadline(s)}d left</span></div>`).join('')}
  </div>`:''}
  <div class="grid grid-2">
    <div class="card">
      <div class="card-title">Recently Added Students</div>
      ${state.students.slice(-5).reverse().map(s=>studentRowMini(s)).join('') || emptyState('No students yet','Add your first student from the Students tab.')}
    </div>
    <div class="card">
      <div class="card-title">Batches</div>
      ${state.batches.slice(0,5).map(b=>`<div class="student-row"><div class="who"><div class="avatar">${esc(b.name[0]||'B')}</div><div><div class="name">${esc(b.name)}</div><div class="batchname">${studentsInBatch(b.id).length} students</div></div></div></div>`).join('') || emptyState('No batches yet','Create a batch to start organizing students.')}
    </div>
  </div>`;
}
function studentRowMini(s){
  const st=computeStatus(s);
  return `<div class="student-row"><div class="who"><div class="avatar">${esc(s.name[0]||'S')}</div><div><div class="name">${esc(s.name)}</div><div class="batchname">${esc(batchById(s.batchId)?.name||'Unassigned')}</div></div></div><span class="stamp ${st==='paid'?'stamp-paid':'stamp-unpaid'}">${st}</span></div>`;
}
function emptyState(title, sub){
  return `<div class="empty-state"><div class="ic">◌</div><div style="font-weight:600;color:var(--ink);">${title}</div><div style="font-size:12.5px;margin-top:4px;">${sub}</div></div>`;
}

/* ---------------- BATCHES ---------------- */
function renderBatches(){
  return `
  <div class="topbar">
    <div><h1>Batches</h1><div class="subtitle">${state.batches.length} batch${state.batches.length===1?'':'es'}</div></div>
    <button class="btn btn-amber" id="addBatchBtn">+ New Batch</button>
  </div>
  <div class="grid grid-3">
    ${state.batches.map(b=>{
      const studs=studentsInBatch(b.id);
      const paid=studs.filter(s=>computeStatus(s)==='paid').length;
      const unpaid=studs.length-paid;
      return `<div class="batch-card" data-batch="${b.id}">
        <div class="swatch">${esc((b.name[0]||'B').toUpperCase())}</div>
        <h3>${esc(b.name)}</h3>
        <div class="meta">${studs.length} student${studs.length===1?'':'s'}</div>
        <div class="fee-row"><span class="p">● ${paid} paid</span><span class="u">● ${unpaid} pending</span></div>
      </div>`;
    }).join('') || `<div class="empty-state" style="grid-column:1/-1;">${emptyState('No batches yet','Click "New Batch" to create your first one.')}</div>`}
  </div>`;
}
f
